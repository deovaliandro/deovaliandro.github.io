<header>
  <nav class="navbar" aria-label="Main navigation">

    <a href="/">
      {{ .Site.Title }}
    </a>

    <ul class="nav-menu desktop-menu">
      {{ range .Site.Menus.main }}
      <li>
        <a
          href="{{ .URL | relLangURL }}"
          class="{{ if eq $.RelPermalink (.URL | relLangURL) }}active{{ end }}"
        >
          {{ .Name }}
        </a>
      </li>
      {{ end }}
    </ul>

    <details class="mobile-menu">
      <summary>Menu</summary>

      <ul>
        {{ range .Site.Menus.main }}
        <li>
          <a
            href="{{ .URL | relLangURL }}"
            class="{{ if eq $.RelPermalink (.URL | relLangURL) }}active{{ end }}"
          >
            {{ .Name }}
          </a>
        </li>
        {{ end }}
      </ul>
    </details>

  </nav>
</header>
