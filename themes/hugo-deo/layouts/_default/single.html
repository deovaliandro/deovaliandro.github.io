{{ define "main" }}

<article class="post">
  <header class="post-header">
    <h1>{{ .Title }}</h1>

    <time
      datetime="{{ .Date.Format "2006-01-02" }}"
      class="metadata"
    >
      {{ .Date.Format "02 Jan 2006" }}
    </time>
  </header>

  <section class="post-content">
    {{ .Content }}
  </section>
</article>

{{ end }}
