{{ define "main" }}

<article class="mx-auto max-w-4xl">

  <header class="mb-8 border-b border-slate-300 pb-6 text-center">
    <h1 class="mb-2 text-2xl font-bold text-slate-900">
      {{ .Title }}
    </h1>

    <time
      datetime="{{ .Date.Format "2006-01-02" }}"
      class="text-sm text-slate-500">
      {{ .Date.Format "02 Jan 2006" }}
    </time>
  </header>

  <section class="
    text-base leading-7 text-slate-700
    [&_a]:font-medium [&_a]:text-blue-600 [&_a]:underline [&_a]:underline-offset-2 hover:[&_a]:text-blue-700
    [&_blockquote]:my-6 [&_blockquote]:border-l-4 [&_blockquote]:border-slate-300 [&_blockquote]:pl-4 [&_blockquote]:italic
    [&_code]:rounded [&_code]:bg-slate-100 [&_code]:px-1.5 [&_code]:py-0.5 [&_code]:font-mono [&_code]:text-sm
    [&_h1]:mb-4 [&_h1]:mt-8 [&_h1]:text-3xl [&_h1]:font-bold [&_h1]:text-slate-900
    [&_h2]:mb-3 [&_h2]:mt-8 [&_h2]:text-2xl [&_h2]:font-bold [&_h2]:text-slate-900
    [&_h3]:mb-3 [&_h3]:mt-6 [&_h3]:text-xl [&_h3]:font-semibold [&_h3]:text-slate-900
    [&_h4]:mb-2 [&_h4]:mt-5 [&_h4]:text-lg [&_h4]:font-semibold [&_h4]:text-slate-900
    [&_hr]:my-8 [&_hr]:border-slate-200
    [&_img]:my-6 [&_img]:h-auto [&_img]:max-w-full [&_img]:rounded-lg
    [&_li]:my-1
    [&_ol]:my-4 [&_ol]:list-decimal [&_ol]:pl-6
    [&_p]:my-4
    [&_pre]:my-6 [&_pre]:overflow-x-auto [&_pre]:rounded-lg [&_pre]:bg-slate-100 [&_pre]:p-4
    [&_pre_code]:bg-transparent [&_pre_code]:p-0
    [&_strong]:font-semibold [&_strong]:text-slate-900
    [&_table]:my-6 [&_table]:w-full [&_table]:border-collapse
    [&_td]:border [&_td]:border-slate-300 [&_td]:p-2
    [&_th]:border [&_th]:border-slate-300 [&_th]:bg-slate-100 [&_th]:p-2 [&_th]:text-left
    [&_ul]:my-4 [&_ul]:list-disc [&_ul]:pl-6
  ">
    {{ .Content }}
  </section>

</article>

{{ end }}
